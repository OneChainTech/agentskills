<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manus Web Console</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#1e293b',
                            900: '#0f172a',
                            950: '#020617',
                        },
                        primary: {
                            DEFAULT: '#3B82F6',
                            hover: '#2563EB',
                            glow: 'rgba(59, 130, 246, 0.5)'
                        },
                        ai: {
                            DEFAULT: '#8B5CF6', // Violet for AI accents
                            dim: 'rgba(139, 92, 246, 0.1)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'blob': 'blob 7s infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569; 
        }
        
        .typing-cursor::after {
            content: '▋';
            animation: blink 1s step-start infinite;
            color: #3B82F6;
            margin-left: 2px;
        }
        
        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Glassmorphism Utilities */
        .glass {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans h-screen flex overflow-hidden selection:bg-primary selection:text-white">

    <!-- Ambient Background -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden">
        <div class="absolute top-0 left-1/4 w-96 h-96 bg-blue-500/10 rounded-full mix-blend-screen filter blur-3xl opacity-30 animate-blob"></div>
        <div class="absolute top-0 right-1/4 w-96 h-96 bg-purple-500/10 rounded-full mix-blend-screen filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>
        <div class="absolute -bottom-32 left-1/3 w-96 h-96 bg-indigo-500/10 rounded-full mix-blend-screen filter blur-3xl opacity-30 animate-blob animation-delay-4000"></div>
    </div>

    <!-- Left Panel: Input & Controls -->
    <aside class="w-[400px] flex flex-col border-r border-white/5 glass z-20 shadow-2xl relative">
        
        <!-- Header -->
        <header class="h-16 flex items-center px-6 border-b border-white/5 bg-slate-900/50">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-600 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-500/20 border border-white/10">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-white">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75L22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3l-4.5 16.5" />
                    </svg>
                </div>
                <h1 class="font-semibold text-lg tracking-tight text-white/90">Manus<span class="text-blue-400">Agent</span></h1>
            </div>
            <div class="ml-auto">
                <div class="flex items-center gap-2 px-2 py-1 rounded-full bg-green-500/10 border border-green-500/20">
                    <div class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                    </div>
                    <span class="text-[10px] font-medium text-green-400 tracking-wide uppercase">Online</span>
                </div>
            </div>
        </header>

        <!-- Form Area -->
        <main class="flex-1 flex flex-col p-6 gap-6 overflow-y-auto">
            
            <div class="space-y-3 flex-1 flex flex-col">
                <label for="taskInput" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider pl-1">
                    Mission Control
                </label>
                <div class="relative group flex-1">
                    <textarea 
                        id="taskInput" 
                        class="w-full h-full min-h-[200px] bg-slate-900/50 border border-white/10 rounded-xl p-4 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary/50 transition-all resize-none font-mono leading-relaxed shadow-inner"
                        placeholder="Initialize task sequence...&#10;&#10;Examples:&#10;> Analyze crypto prices via API&#10;> Generate a Mandelbrot set visualization&#10;> Scrape and summarize tech news"
                        spellcheck="false"
                    ></textarea>
                    
                    <!-- Decorative corner accents -->
                    <div class="absolute top-0 left-0 w-2 h-2 border-t border-l border-white/20 rounded-tl-xl pointer-events-none"></div>
                    <div class="absolute top-0 right-0 w-2 h-2 border-t border-r border-white/20 rounded-tr-xl pointer-events-none"></div>
                    <div class="absolute bottom-0 left-0 w-2 h-2 border-b border-l border-white/20 rounded-bl-xl pointer-events-none"></div>
                    <div class="absolute bottom-0 right-0 w-2 h-2 border-b border-r border-white/20 rounded-br-xl pointer-events-none"></div>
                </div>
            </div>

            <!-- Environment Info -->
            <div class="p-4 rounded-lg glass-panel text-xs space-y-2">
                <div class="flex justify-between items-center text-slate-400">
                    <span>Environment</span>
                    <span class="text-blue-400 font-mono">E2B Firecracker</span>
                </div>
                <div class="flex justify-between items-center text-slate-400">
                    <span>Runtime</span>
                    <span class="text-yellow-400 font-mono">Python 3.12</span>
                </div>
                <div class="flex justify-between items-center text-slate-400">
                    <span>Model</span>
                    <span class="text-purple-400 font-mono">DeepSeek V3</span>
                </div>
            </div>

            <!-- Action Bar -->
            <div class="mt-auto pt-2">
                <button 
                    id="runBtn"
                    class="w-full group relative flex items-center justify-center gap-2 bg-primary hover:bg-primary-hover text-white font-medium py-3.5 px-4 rounded-xl shadow-lg shadow-blue-500/20 transition-all active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed overflow-hidden border border-white/10"
                >
                    <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-1000"></div>
                    
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 transition-transform group-hover:rotate-90 duration-500">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.348a1.125 1.125 0 010 1.971l-11.54 6.347a1.125 1.125 0 01-1.667-.985V5.653z" />
                    </svg>
                    <span class="tracking-wide">Execute Protocol</span>
                </button>
            </div>

        </main>
    </aside>

    <!-- Right Panel: Terminal / Preview -->
    <section class="flex-1 relative flex flex-col min-w-0 z-10">
        
        <!-- Tabs Header -->
        <div class="h-16 flex items-end px-4 border-b border-white/5 bg-slate-950/80">
            <div class="flex gap-1">
                <button id="tabConsole" class="group relative px-6 py-2.5 text-sm font-medium text-white transition-colors">
                    <span class="relative z-10 flex items-center gap-2">
                        <svg class="w-4 h-4 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                        Terminal
                    </span>
                    <div id="tabConsoleIndicator" class="absolute bottom-0 left-0 w-full h-0.5 bg-blue-500 shadow-[0_0_10px_rgba(59,130,246,0.5)]"></div>
                    <div class="absolute inset-0 bg-white/5 rounded-t-lg opacity-0 group-hover:opacity-100 transition-opacity"></div>
                </button>
                
                <button id="tabPreview" class="group relative px-6 py-2.5 text-sm font-medium text-slate-400 hover:text-white transition-colors">
                    <span class="relative z-10 flex items-center gap-2">
                        <svg class="w-4 h-4 text-purple-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                        Visualizer
                    </span>
                    <div id="tabPreviewIndicator" class="absolute bottom-0 left-0 w-full h-0.5 bg-purple-500 shadow-[0_0_10px_rgba(168,85,247,0.5)] hidden"></div>
                    <div class="absolute inset-0 bg-white/5 rounded-t-lg opacity-0 group-hover:opacity-100 transition-opacity"></div>
                </button>
            </div>
        </div>

        <!-- Console View -->
        <div id="consoleView" class="flex-1 flex flex-col overflow-hidden relative bg-[#0B0F19]">
            <!-- Decorative Grid -->
            <div class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.02)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.02)_1px,transparent_1px)] bg-[size:24px_24px] pointer-events-none"></div>
            
            <div id="terminalOutput" class="flex-1 overflow-y-auto p-8 font-mono text-[13px] leading-relaxed relative z-10">
                 <div class="text-slate-500 mb-6 border-b border-white/5 pb-4">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="text-blue-500">➜</span>
                        <span class="text-slate-300">init_session</span>
                        <span class="text-slate-600">--environment=e2b-firecracker</span>
                    </div>
                    <p class="pl-5 opacity-70">Manus Agent initialized. Sandbox ready. Waiting for input...</p>
                </div>
                <div id="logs" class="space-y-3 pl-2 border-l-2 border-white/5"></div>
                <div class="mt-4 pl-5 text-blue-500 font-bold typing-cursor inline-block">&nbsp;</div>
            </div>
        </div>

        <!-- Preview View -->
        <div id="previewView" class="hidden flex-1 flex-col bg-white relative">
             <iframe id="previewFrame" class="w-full h-full border-none hidden z-10 relative"></iframe>
             <div id="previewPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-50 gap-4">
                <div class="w-24 h-24 rounded-full bg-slate-100 flex items-center justify-center shadow-inner">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="w-10 h-10 text-slate-300">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                    </svg>
                </div>
                <div class="text-center space-y-1">
                    <p class="text-slate-900 font-medium">No Active Visualization</p>
                    <p class="text-slate-500 text-sm">Generated files and images will appear here.</p>
                </div>
             </div>
        </div>

    </section>

    <!-- Interactive Script -->
    <script>
        const runBtn = document.getElementById('runBtn');
        const taskInput = document.getElementById('taskInput');
        const logsContainer = document.getElementById('logs');
        const terminalOutput = document.getElementById('terminalOutput');
        
        // Tab Elements
        const tabConsole = document.getElementById('tabConsole');
        const tabPreview = document.getElementById('tabPreview');
        const tabConsoleIndicator = document.getElementById('tabConsoleIndicator');
        const tabPreviewIndicator = document.getElementById('tabPreviewIndicator');
        const consoleView = document.getElementById('consoleView');
        const previewView = document.getElementById('previewView');
        const previewFrame = document.getElementById('previewFrame');
        const previewPlaceholder = document.getElementById('previewPlaceholder');

        const sleep = (ms) => new Promise(r => setTimeout(r, ms));

        function switchTab(tab) {
            if (tab === 'console') {
                tabConsole.classList.add('text-white');
                tabConsole.classList.remove('text-slate-400');
                tabConsoleIndicator.classList.remove('hidden');
                
                tabPreview.classList.add('text-slate-400');
                tabPreview.classList.remove('text-white');
                tabPreviewIndicator.classList.add('hidden');

                consoleView.classList.remove('hidden');
                previewView.classList.add('hidden');
            } else {
                tabPreview.classList.add('text-white');
                tabPreview.classList.remove('text-slate-400');
                tabPreviewIndicator.classList.remove('hidden');

                tabConsole.classList.add('text-slate-400');
                tabConsole.classList.remove('text-white');
                tabConsoleIndicator.classList.add('hidden');

                consoleView.classList.add('hidden');
                previewView.classList.remove('hidden');
            }
        }

        tabConsole.addEventListener('click', () => switchTab('console'));
        tabPreview.addEventListener('click', () => switchTab('preview'));

        function createLogLine(text, type = 'info') {
            const div = document.createElement('div');
            div.className = 'flex gap-3 group hover:bg-white/5 p-1 rounded transition-colors';
            
            let colorClass = 'text-slate-300';
            let icon = '•';
            
            if (type === 'error') {
                colorClass = 'text-red-400';
                icon = '✖';
            } else if (type === 'success') {
                colorClass = 'text-green-400';
                icon = '✔';
            } else if (type === 'system') {
                colorClass = 'text-blue-400';
                icon = 'ℹ';
            } else if (type === 'dim') {
                colorClass = 'text-slate-500 italic';
                icon = '›';
            }

            const timestamp = new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute:'2-digit', second:'2-digit' });
            
            div.innerHTML = `
                <span class="text-slate-700 font-mono text-[11px] pt-0.5 select-none">${timestamp}</span>
                <span class="text-slate-600 select-none">${icon}</span>
                <span class="${colorClass} flex-1 break-words">${text}</span>
            `;
            return div;
        }

        async function appendLog(text, type = 'info') {
            const line = createLogLine(text, type);
            logsContainer.appendChild(line);
            // Keep scroll at bottom
            requestAnimationFrame(() => {
                terminalOutput.scrollTo({ top: terminalOutput.scrollHeight, behavior: 'smooth' });
            });
        }

        async function handleEvent(event) {
            switch(event.type) {
                case 'system':
                    await appendLog(event.message, 'dim');
                    break;
                case 'status':
                    await appendLog(event.message, 'system');
                    break;
                case 'code':
                    await appendLog('Generated Python Code:', 'system');
                    const codeBlock = document.createElement('div');
                    codeBlock.className = 'ml-12 my-2 p-4 bg-[#0F131F] border border-blue-900/30 rounded-lg text-xs font-mono text-blue-200 whitespace-pre overflow-x-auto shadow-inner custom-scroll';
                    codeBlock.innerHTML = `<code class="language-python">${event.content}</code>`;
                    logsContainer.appendChild(codeBlock);
                    terminalOutput.scrollTo({ top: terminalOutput.scrollHeight, behavior: 'smooth' });
                    break;
                case 'output':
                    try {
                        const trimmed = event.content.trim();
                        if (trimmed.startsWith('{') && trimmed.endsWith('}')) {
                            const data = JSON.parse(trimmed);
                            if (data.type === 'file_preview' || data.type === 'preview') {
                                await handleEvent({
                                    type: 'preview',
                                    path: data.path,
                                    mime: data.mime,
                                    content: data.content
                                });
                                await appendLog(`(Output converted to preview: ${data.path})`, 'dim');
                                return;
                            }
                        }
                    } catch (e) {}

                    await appendLog('Execution Result:', 'success');
                    const outBlock = document.createElement('div');
                    outBlock.className = 'ml-12 my-2 p-4 bg-black/50 border-l-2 border-green-500/50 rounded-r-lg text-xs font-mono text-green-300 whitespace-pre overflow-x-auto';
                    outBlock.textContent = event.content;
                    logsContainer.appendChild(outBlock);
                    terminalOutput.scrollTo({ top: terminalOutput.scrollHeight, behavior: 'smooth' });
                    break;
                case 'answer':
                    await appendLog('Agent Answer:', 'success');
                    const answerBlock = document.createElement('div');
                    answerBlock.className = 'ml-12 my-2 p-5 bg-slate-800/50 border border-slate-700 rounded-xl text-sm font-sans text-slate-200 whitespace-pre-wrap shadow-lg';
                    answerBlock.textContent = event.content;
                    logsContainer.appendChild(answerBlock);
                    terminalOutput.scrollTo({ top: terminalOutput.scrollHeight, behavior: 'smooth' });
                    break;
                case 'success':
                    await appendLog(event.message, 'success');
                    break;
                case 'error':
                    await appendLog(event.message, 'error');
                    break;
                case 'preview':
                case 'file_preview':
                    await appendLog(`Artifact Generated: ${event.path || 'Preview'}`, 'success');
                    
                    // Show notification dot on preview tab
                    tabPreviewIndicator.classList.remove('hidden');
                    tabPreviewIndicator.classList.add('animate-pulse');
                    
                    if (!event.content && event.mime !== 'url') {
                        return;
                    }

                    previewPlaceholder.classList.add('hidden');
                    previewFrame.classList.remove('hidden');
                    
                    // Reset iframe
                    previewFrame.src = "about:blank";
                    previewFrame.removeAttribute("srcdoc");

                    setTimeout(() => {
                        if (event.mime === 'url') {
                            previewFrame.src = event.content;
                        } else if (event.mime === 'text/html') {
                            previewFrame.srcdoc = event.content;
                        } else if (event.mime && event.mime.startsWith('image/')) {
                            previewFrame.srcdoc = `
                                <body style="margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#f0f0f0;">
                                    <img src="data:${event.mime};base64,${event.content}" style="max-width:100%;max-height:100%;box-shadow:0 0 30px rgba(0,0,0,0.1);">
                                </body>`;
                        } else {
                            previewFrame.srcdoc = `<pre style="padding:20px;white-space:pre-wrap;font-family:monospace;color:#333;font-size:12px;">${event.content}</pre>`;
                        }
                    }, 50);
                    break;
            }
        }

        runBtn.addEventListener('click', async () => {
            const task = taskInput.value.trim();
            if (!task) {
                taskInput.focus();
                taskInput.classList.add('ring-2', 'ring-red-500/50');
                setTimeout(() => taskInput.classList.remove('ring-2', 'ring-red-500/50'), 500);
                return;
            }

            // Disable UI
            runBtn.disabled = true;
            const originalBtnContent = runBtn.innerHTML;
            runBtn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Processing...
            `;

            logsContainer.innerHTML = ''; // Clear previous logs
            switchTab('console');
            
            try {
                await appendLog(`Sequence initiated for task: "${task}"`, 'system');

                const response = await fetch('/api/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task })
                });

                if (!response.ok) {
                    throw new Error(`Server returned ${response.status}: ${response.statusText}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); 

                    for (const line of lines) {
                        if (!line.trim()) continue;
                        try {
                            const event = JSON.parse(line);
                            await handleEvent(event);
                        } catch (e) {
                            console.error("JSON Parse error:", line, e);
                        }
                    }
                }
                
            } catch (e) {
                console.error("Execution error:", e);
                await appendLog(`Critical Failure: ${e.message}`, 'error');
            } finally {
                // Reset UI
                runBtn.disabled = false;
                runBtn.innerHTML = originalBtnContent;
            }
        });
    </script>
</body>
</html>
