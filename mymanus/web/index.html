<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manus Web Console</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            850: '#172033', // Custom
                            900: '#0f172a',
                            950: '#020617',
                        },
                        primary: {
                            DEFAULT: '#3B82F6',
                            hover: '#2563EB',
                            light: '#60A5FA',
                            glow: 'rgba(59, 130, 246, 0.5)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'blob': 'blob 7s infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; /* Light mode thumb */
            border-radius: 3px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #334155; /* Dark mode thumb */
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        .dark ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        
        .typing-cursor::after {
            content: '▋';
            animation: blink 1s step-start infinite;
            color: #3B82F6;
            margin-left: 2px;
        }
        
        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Tab Styles */
        .tab-active {
            color: #0f172a; /* slate-900 */
        }
        .dark .tab-active {
            color: #ffffff;
        }
        .tab-inactive {
            color: #64748b; /* slate-500 */
        }
        .dark .tab-inactive {
            color: #94a3b8; /* slate-400 */
        }

        /* Glassmorphism Utilities */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .dark .glass-panel {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        @keyframes pulse-border {
            0% { border-color: rgba(59, 130, 246, 0.5); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.2); }
            50% { border-color: rgba(59, 130, 246, 1); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
            100% { border-color: rgba(59, 130, 246, 0.5); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.2); }
        }
        .animate-pulse-border {
            animation: pulse-border 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-200 font-sans h-screen flex overflow-hidden selection:bg-primary selection:text-white transition-colors duration-300">

    <!-- Ambient Background -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden">
        <div class="absolute top-0 left-1/4 w-96 h-96 bg-blue-500/10 rounded-full mix-blend-screen filter blur-3xl opacity-30 animate-blob"></div>
        <div class="absolute top-0 right-1/4 w-96 h-96 bg-purple-500/10 rounded-full mix-blend-screen filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>
        <div class="absolute -bottom-32 left-1/3 w-96 h-96 bg-indigo-500/10 rounded-full mix-blend-screen filter blur-3xl opacity-30 animate-blob animation-delay-4000"></div>
    </div>

    <!-- Left Panel: Input & Controls -->
    <aside class="w-[400px] flex flex-col border-r border-slate-200 dark:border-white/5 glass z-20 shadow-2xl relative transition-colors duration-300">
        
        <!-- Header -->
        <header class="h-16 flex items-center px-6 border-b border-slate-200 dark:border-white/5 bg-white/50 dark:bg-slate-900/50">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-600 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-500/20 border border-white/10">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-white">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75L22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3l-4.5 16.5" />
                    </svg>
                </div>
                <h1 class="font-semibold text-lg tracking-tight text-slate-800 dark:text-white/90">Manus<span class="text-blue-500 dark:text-blue-400">Agent</span></h1>
            </div>
            
            <div class="ml-auto flex items-center gap-3">
                 <!-- Theme Toggle -->
                 <button id="themeToggle" class="p-2 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors focus:outline-none">
                    <svg id="sunIcon" class="w-4 h-4 hidden dark:block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
                    </svg>
                    <svg id="moonIcon" class="w-4 h-4 block dark:hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
                    </svg>
                </button>

                <div class="flex items-center gap-2 px-2 py-1 rounded-full bg-green-500/10 border border-green-500/20">
                    <div class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                    </div>
                    <span class="text-[10px] font-medium text-green-600 dark:text-green-400 tracking-wide uppercase">Online</span>
                </div>
            </div>
        </header>

        <!-- Form Area -->
        <main class="flex-1 flex flex-col p-6 gap-6 overflow-y-auto">
            
            <div class="space-y-3 flex-1 flex flex-col">
                <div class="flex items-center justify-between pr-1">
                    <label for="taskInput" class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider pl-1">
                        Mission
                    </label>
                </div>
                <div class="relative group flex-1 flex flex-col gap-3">
                    <textarea 
                        id="taskInput" 
                        class="w-full flex-1 min-h-[130px] bg-white dark:bg-slate-900/50 border border-slate-200 dark:border-white/10 rounded-xl p-4 text-sm text-slate-800 dark:text-slate-200 placeholder-slate-400 dark:placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary/50 transition-all resize-none font-mono leading-relaxed shadow-sm dark:shadow-inner"
                        placeholder="Initialize task sequence..."
                        spellcheck="false"
                    ></textarea>
                    
                    <!-- File Upload Button (Below Input) -->
                    <div class="flex items-center gap-2">
                        <label class="cursor-pointer group/attach flex items-center gap-2 px-3 py-2 rounded-lg bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 border border-slate-200 dark:border-white/10 transition-all shadow-sm active:scale-95">
                            <input type="file" id="fileInput" class="hidden" multiple />
                            <svg class="w-4 h-4 text-slate-400 group-hover/attach:text-blue-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
                            </svg>
                            <span class="text-xs font-medium text-slate-500 group-hover/attach:text-slate-700 dark:group-hover/attach:text-slate-300">Add Files</span>
                        </label>
                        <div id="fileChips" class="flex flex-wrap gap-2"></div>
                    </div>
                </div>
            </div>

            <!-- Quick Start Examples -->
            <div class="space-y-3">
                 <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider pl-1">
                    Quick Start
                </label>
                <div class="grid grid-cols-1 gap-2">
                    <!-- Type 1: Data Analysis -->
                    <button onclick="setTask('生成一份包含 [日期, 地区, 产品类别, 销售额, 利润] 的模拟电商数据（100条），使用 Plotly 绘制一个交互式的柱状图（Bar Chart）展示各地区和类别的销售占比，并保存为 HTML 报告。')" class="text-left px-4 py-3 bg-white dark:bg-slate-800/50 hover:bg-blue-50 dark:hover:bg-slate-800 border border-slate-200 dark:border-white/10 rounded-lg transition-all group shadow-sm hover:shadow-md hover:border-blue-300 dark:hover:border-blue-700">
                        <div class="flex items-center gap-3">
                            <span class="p-1.5 rounded-md bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z" /></svg>
                            </span>
                            <div class="flex-1">
                                <div class="text-xs font-semibold text-slate-700 dark:text-slate-200 group-hover:text-blue-600 dark:group-hover:text-blue-400">深度数据洞察</div>
                                <div class="text-[10px] text-slate-500 dark:text-slate-400">Pandas + Plotly Bar Chart</div>
                            </div>
                        </div>
                    </button>

                    <!-- Type 3: Streamlit App -->
                    <button onclick="setTask('编写一个 Python Streamlit 应用，生成一些随机数据并绘制交互式图表。在沙箱中运行该应用（端口 8501），并提供公开访问的 URL 预览。')" class="text-left px-4 py-3 bg-white dark:bg-slate-800/50 hover:bg-amber-50 dark:hover:bg-slate-800 border border-slate-200 dark:border-white/10 rounded-lg transition-all group shadow-sm hover:shadow-md hover:border-amber-300 dark:hover:border-amber-700">
                         <div class="flex items-center gap-3">
                            <span class="p-1.5 rounded-md bg-amber-100 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                            </span>
                            <div class="flex-1">
                                <div class="text-xs font-semibold text-slate-700 dark:text-slate-200 group-hover:text-amber-600 dark:group-hover:text-amber-400">Streamlit 应用</div>
                                <div class="text-[10px] text-slate-500 dark:text-slate-400">Python Web + Public URL</div>
                            </div>
                        </div>
                    </button>

                    <!-- Type 4: Upload Analysis -->
                    <button onclick="setTask('请读取我上传的数据文件（CSV/Excel），分析数据的基本统计信息（行数、列名、缺失值），并针对数值列绘制分布直方图。最后，请遵循 UI/UX Pro Max 规范生成一份专业的 HTML 可视化报告，并调用可视化工具展示。')" class="text-left px-4 py-3 bg-white dark:bg-slate-800/50 hover:bg-purple-50 dark:hover:bg-slate-800 border border-slate-200 dark:border-white/10 rounded-lg transition-all group shadow-sm hover:shadow-md hover:border-purple-300 dark:hover:border-purple-700">
                         <div class="flex items-center gap-3">
                            <span class="p-1.5 rounded-md bg-purple-100 dark:bg-purple-900/30 text-purple-600 dark:text-purple-400">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                            </span>
                            <div class="flex-1">
                                <div class="text-xs font-semibold text-slate-700 dark:text-slate-200 group-hover:text-purple-600 dark:group-hover:text-purple-400">智能文件分析</div>
                                <div class="text-[10px] text-slate-500 dark:text-slate-400">自动生成专业 HTML 报告</div>
                            </div>
                        </div>
                    </button>
                </div>
            </div>
                </div>
            </div>

            <!-- Environment Info -->
            <div class="p-4 rounded-lg glass-panel text-xs space-y-2 mt-auto hidden">
                <div class="flex justify-between items-center text-slate-500 dark:text-slate-400 border-b border-slate-100 dark:border-white/5 pb-2 mb-2">
                    <span>Architecture</span>
                    <span class="text-emerald-600 dark:text-emerald-400 font-bold uppercase tracking-tight">LangChain 1.0</span>
                </div>
                <div class="flex justify-between items-center text-slate-500 dark:text-slate-400">
                    <span>Environment</span>
                    <span class="text-blue-600 dark:text-blue-400 font-mono">E2B Firecracker</span>
                </div>
                <div class="flex justify-between items-center text-slate-500 dark:text-slate-400">
                    <span>Runtime</span>
                    <span class="text-yellow-600 dark:text-yellow-400 font-mono">Python 3.12</span>
                </div>
                <div class="flex justify-between items-center text-slate-500 dark:text-slate-400">
                    <span>Model</span>
                    <span class="text-purple-600 dark:text-purple-400 font-mono">DeepSeek V3</span>
                </div>
            </div>

            <!-- Action Bar -->
            <div class="pt-2">
                <button 
                    id="runBtn"
                    class="w-full group relative flex items-center justify-center gap-2 bg-slate-900 dark:bg-primary hover:bg-slate-800 dark:hover:bg-primary-hover text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-blue-500/20 transition-all active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed overflow-hidden border border-white/10"
                >
                    <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-1000"></div>
                    
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5 transition-transform group-hover:rotate-90 duration-500">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.348a1.125 1.125 0 010 1.971l-11.54 6.347a1.125 1.125 0 01-1.667-.985V5.653z" />
                    </svg>
                    <span class="tracking-widest uppercase text-xs">Execute</span>
                </button>
            </div>

        </main>
    </aside>

    <!-- Right Panel: Terminal / Preview -->
    <section class="flex-1 relative flex flex-col min-w-0 z-10">
        
        <!-- Tabs Header (Swapped: Visualizer First) -->
        <div class="h-16 flex items-end px-4 border-b border-slate-200 dark:border-white/5 bg-white/80 dark:bg-slate-950/80 backdrop-blur-md z-30">
            <div class="flex gap-1">
                
                <!-- Preview Tab (Default Active) -->
                <button id="tabPreview" class="group relative px-6 py-2.5 text-sm font-medium tab-active transition-colors">
                    <span class="relative z-10 flex items-center gap-2">
                        <svg class="w-4 h-4 text-purple-500 dark:text-purple-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                        Visualizer
                    </span>
                    <!-- Active Indicator (Visible by default) -->
                    <div id="tabPreviewIndicator" class="absolute bottom-0 left-0 w-full h-0.5 bg-purple-500 shadow-[0_0_10px_rgba(168,85,247,0.5)]"></div>
                    <div class="absolute inset-0 bg-slate-100 dark:bg-white/5 rounded-t-lg opacity-0 group-hover:opacity-100 transition-opacity"></div>
                </button>

                <!-- Console Tab -->
                <button id="tabConsole" class="group relative px-6 py-2.5 text-sm font-medium tab-inactive hover:tab-active transition-colors">
                    <span class="relative z-10 flex items-center gap-2">
                        <svg class="w-4 h-4 text-blue-500 dark:text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                        Terminal
                    </span>
                    <div id="tabConsoleIndicator" class="absolute bottom-0 left-0 w-full h-0.5 bg-blue-500 shadow-[0_0_10px_rgba(59,130,246,0.5)] hidden"></div>
                    <div class="absolute inset-0 bg-slate-100 dark:bg-white/5 rounded-t-lg opacity-0 group-hover:opacity-100 transition-opacity"></div>
                </button>

            </div>
        </div>

        <!-- Content Area -->
        <div class="flex-1 relative overflow-hidden bg-slate-100 dark:bg-[#0B0F19]">
            
            <!-- Console View (Hidden by default) -->
            <div id="consoleView" class="absolute inset-0 flex flex-col hidden bg-white dark:bg-[#0B0F19]">
                 <!-- Decorative Grid -->
                <div class="absolute inset-0 bg-[linear-gradient(rgba(0,0,0,0.02)_1px,transparent_1px),linear-gradient(90deg,rgba(0,0,0,0.02)_1px,transparent_1px)] dark:bg-[linear-gradient(rgba(255,255,255,0.02)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.02)_1px,transparent_1px)] bg-[size:24px_24px] pointer-events-none"></div>
                
                <div id="terminalOutput" class="flex-1 overflow-y-auto p-8 font-mono text-[13px] leading-relaxed relative z-10">
                     <div class="text-slate-500 dark:text-slate-500 mb-6 border-b border-slate-200 dark:border-white/5 pb-4">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-blue-500">➜</span>
                            <span class="text-slate-700 dark:text-slate-300">init_session</span>
                            <span class="text-slate-400 dark:text-slate-600">--environment=e2b-firecracker</span>
                        </div>
                        <p class="pl-5 opacity-70">Manus Agent initialized. Sandbox ready. Waiting for input...</p>
                    </div>
                    <div id="logs" class="space-y-3 pl-2 border-l-2 border-slate-200 dark:border-white/5"></div>
                    <div class="mt-4 pl-5 text-blue-500 font-bold typing-cursor inline-block">&nbsp;</div>
                </div>
            </div>

            <!-- Preview View (Visible by default) -->
            <div id="previewView" class="absolute inset-0 flex flex-col bg-white dark:bg-slate-900 overflow-hidden">
                 <iframe id="previewFrame" class="w-full h-full border-none hidden z-10 relative"></iframe>
                 
                 <!-- Empty State Placeholder -->
                 <div id="previewPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-50 dark:bg-slate-900 gap-4">
                    <div class="w-24 h-24 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center shadow-inner">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="w-10 h-10 text-slate-400 dark:text-slate-500">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                        </svg>
                    </div>
                    <div class="text-center space-y-1">
                        <p class="text-slate-900 dark:text-slate-200 font-medium">Ready to Visualize</p>
                        <p class="text-slate-500 dark:text-slate-500 text-sm">Execute a task to see the workflow and results here.</p>
                    </div>
                 </div>
                 
                 <!-- Workflow Container (Dynamically populated) -->
                 <div id="workflowContainer" class="w-full h-full overflow-y-auto p-6 space-y-6 hidden bg-slate-50 dark:bg-slate-900"></div>
            </div>

        </div>
    </section>

    <!-- Interactive Script -->
    <script>
        // DOM Elements
        const runBtn = document.getElementById('runBtn');
        const taskInput = document.getElementById('taskInput');
        const logsContainer = document.getElementById('logs');
        const terminalOutput = document.getElementById('terminalOutput');
        const themeToggle = document.getElementById('themeToggle');
        
        // Tab Elements
        const tabConsole = document.getElementById('tabConsole');
        const tabPreview = document.getElementById('tabPreview');
        const tabConsoleIndicator = document.getElementById('tabConsoleIndicator');
        const tabPreviewIndicator = document.getElementById('tabPreviewIndicator');
        const consoleView = document.getElementById('consoleView');
        const previewView = document.getElementById('previewView');
        const previewFrame = document.getElementById('previewFrame');
        const previewPlaceholder = document.getElementById('previewPlaceholder');
        const workflowContainer = document.getElementById('workflowContainer');
        const fileInput = document.getElementById('fileInput');
        const fileChips = document.getElementById('fileChips');
        let uploadedFiles = []; // Stores absolute paths
        let activeUploads = 0;

        function updateRunButtonState() {
            if (activeUploads > 0) {
                runBtn.disabled = true;
                runBtn.classList.add('opacity-50', 'cursor-not-allowed');
                runBtn.querySelector('span').textContent = 'UPLOADING...';
            } else {
                runBtn.disabled = false;
                runBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                runBtn.querySelector('span').textContent = 'EXECUTE';
            }
        }

        // File Upload Logic
        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            activeUploads += files.length;
            updateRunButtonState();

            for (const file of files) {
                const formData = new FormData();
                formData.append('file', file);

                // Optimistic UI
                const chipId = 'chip-' + Date.now();
                const chip = document.createElement('div');
                chip.id = chipId;
                chip.className = 'flex items-center gap-2 px-3 py-1.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-300 animate-pulse';
                chip.innerHTML = `
                    <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                    <span class="truncate max-w-[100px]">${file.name}</span>
                `;
                fileChips.appendChild(chip);

                try {
                    const response = await fetch('/api/upload', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();
                    
                    if (data.path) {
                        uploadedFiles.push(data.path);
                        chip.classList.remove('animate-pulse');
                        chip.classList.add('border-blue-200', 'dark:border-blue-800', 'bg-blue-50', 'dark:bg-blue-900/20', 'text-blue-700', 'dark:text-blue-300');
                        chip.innerHTML = `
                            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                            <span class="truncate max-w-[100px]">${file.name}</span>
                        `;
                    }
                } catch (error) {
                    chip.classList.remove('animate-pulse');
                    chip.classList.add('border-red-200', 'dark:border-red-800', 'text-red-500');
                    console.error('Upload failed', error);
                } finally {
                    activeUploads--;
                    updateRunButtonState();
                }
            }
            fileInput.value = ''; // Reset
        });

        // Theme Handling
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }
        initTheme();

        themeToggle.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        });

        // Helper: Set Task
        window.setTask = (text) => {
            taskInput.value = text;
            taskInput.focus();
            // Highlight effect
            taskInput.classList.add('ring-2', 'ring-primary/50');
            setTimeout(() => taskInput.classList.remove('ring-2', 'ring-primary/50'), 500);
        };

        // Tabs Logic
        function switchTab(tab) {
            if (tab === 'console') {
                // Console Active
                tabConsole.classList.add('tab-active');
                tabConsole.classList.remove('tab-inactive');
                tabConsoleIndicator.classList.remove('hidden');
                
                // Preview Inactive
                tabPreview.classList.add('tab-inactive');
                tabPreview.classList.remove('tab-active');
                tabPreviewIndicator.classList.add('hidden');

                consoleView.classList.remove('hidden');
                previewView.classList.add('hidden');
            } else {
                // Preview Active
                tabPreview.classList.add('tab-active');
                tabPreview.classList.remove('tab-inactive');
                tabPreviewIndicator.classList.remove('hidden');

                // Console Inactive
                tabConsole.classList.add('tab-inactive');
                tabConsole.classList.remove('tab-active');
                tabConsoleIndicator.classList.add('hidden');

                consoleView.classList.add('hidden');
                previewView.classList.remove('hidden');
            }
        }

        tabConsole.addEventListener('click', () => switchTab('console'));
        tabPreview.addEventListener('click', () => switchTab('preview'));

        function createLogLine(text, type = 'info') {
            const div = document.createElement('div');
            div.className = 'flex gap-3 group hover:bg-black/5 dark:hover:bg-white/5 p-1 rounded transition-colors';
            
            let colorClass = 'text-slate-600 dark:text-slate-300';
            let icon = '•';
            
            if (type === 'error') {
                colorClass = 'text-red-600 dark:text-red-400';
                icon = '✖';
            } else if (type === 'success') {
                colorClass = 'text-green-600 dark:text-green-400';
                icon = '✔';
            } else if (type === 'system') {
                colorClass = 'text-blue-600 dark:text-blue-400';
                icon = 'ℹ';
            } else if (type === 'dim') {
                colorClass = 'text-slate-400 dark:text-slate-500 italic';
                icon = '›';
            }

            const timestamp = new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute:'2-digit', second:'2-digit' });
            
            div.innerHTML = `
                <span class="text-slate-400 dark:text-slate-700 font-mono text-[11px] pt-0.5 select-none">${timestamp}</span>
                <span class="text-slate-400 dark:text-slate-600 select-none">${icon}</span>
                <span class="${colorClass} flex-1 break-words">${text}</span>
            `;
            return div;
        }

        async function appendLog(text, type = 'info') {
            const line = createLogLine(text, type);
            logsContainer.appendChild(line);
            requestAnimationFrame(() => {
                terminalOutput.scrollTo({ top: terminalOutput.scrollHeight, behavior: 'smooth' });
            });
        }

        // --- Workflow Visualization Logic ---

        let currentTurnDiv = null;

        function getOrCreateTurnDiv(turnIndex) {
            let id = `turn-${turnIndex}`;
            let el = document.getElementById(id);
            if (!el) {
                // Remove active state and animation from previous turns
                document.querySelectorAll('.turn-card').forEach(card => {
                    card.classList.remove('ring-2', 'ring-blue-500/30', 'border-blue-500/50', 'animate-pulse-border');
                    card.classList.add('border-slate-200', 'dark:border-slate-700');
                });

                el = document.createElement('div');
                el.id = id;
                el.className = 'turn-card bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-blue-500/50 dark:border-blue-500/50 ring-2 ring-blue-500/10 overflow-hidden animate-in fade-in slide-in-from-bottom-2 duration-300 mb-6 animate-pulse-border';
                
                // Header
                el.innerHTML = `
                    <div class="px-4 py-3 bg-slate-50 dark:bg-slate-800/50 border-b border-slate-100 dark:border-slate-700 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-7 h-7 rounded-lg bg-blue-600 flex items-center justify-center text-white text-xs font-bold shadow-md shadow-blue-500/20">
                                ${turnIndex}
                            </div>
                            <span class="text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider flex items-center gap-2">
                                Step ${turnIndex}
                            </span>
                        </div>
                        <button onclick="copyStepOutput('${id}')" class="p-1.5 rounded-md text-slate-400 hover:text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/20 transition-all" title="Copy Output">
                             <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
                        </button>
                    </div>
                    <div class="p-5 space-y-4 content-area"></div>
                `;
                workflowContainer.appendChild(el);
                workflowContainer.scrollTo({ top: workflowContainer.scrollHeight, behavior: 'smooth' });
            }
            return el.querySelector('.content-area');
        }

        window.copyStepOutput = (stepId) => {
            const stepEl = document.getElementById(stepId);
            if (!stepEl) return;
            
            // Collect text content intelligently
            const contentArea = stepEl.querySelector('.content-area');
            let textToCopy = "";
            
            // Iterate over children to handle code blocks and text separately if needed, 
            // but innerText usually does a good job for simple copy.
            textToCopy = contentArea.innerText;

            navigator.clipboard.writeText(textToCopy).then(() => {
                const btn = stepEl.querySelector('button');
                const originalHTML = btn.innerHTML;
                
                // Show success state
                btn.innerHTML = `<svg class="w-4 h-4 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>`;
                
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        };

        const toolNameMap = {
            'run_code': 'Executing Python',
            'run_shell_command': 'Running Shell',
            'write_file': 'Saving File',
            'read_file': 'Reading File',
            'list_files': 'Listing Directory',
            'install_package': 'Installing Library',
            'visualize_file': 'Generating Artifact',
            'get_public_url': 'Exposing Port',
            'default': 'Processing'
        };

        function appendAction(toolName, args) {
            if (!currentTurnDiv) return;

            const div = document.createElement('div');
            div.className = 'group flex flex-col gap-1 p-3 bg-white dark:bg-slate-800/50 rounded-lg border border-slate-100 dark:border-slate-700 shadow-sm transition-all hover:border-blue-200 dark:hover:border-blue-900/50';
            
            const iconMap = {
                'run_code': '<svg class="w-4 h-4 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" /></svg>',
                'run_shell_command': '<svg class="w-4 h-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>',
                'visualize_file': '<svg class="w-4 h-4 text-purple-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>',
                'default': '<svg class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>'
            };
            const icon = iconMap[toolName] || iconMap['default'];
            const displayName = toolNameMap[toolName] || toolName;

            // Extract preview text from args
            let previewText = "";
            if (args) {
                const content = args.code || args.command || args.path || args.package_name || "";
                previewText = content.substring(0, 50).replace(/\n/g, ' ') + (content.length > 50 ? '...' : '');
            }

            div.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="p-1.5 bg-slate-100 dark:bg-slate-900 rounded-md shrink-0">
                        ${icon}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between gap-2">
                            <span class="font-semibold text-xs text-slate-700 dark:text-slate-200">${displayName}</span>
                            <div class="status-badge">
                                <span class="relative flex h-2 w-2">
                                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                                  <span class="relative inline-flex rounded-full h-2 w-2 bg-blue-500"></span>
                                </span>
                            </div>
                        </div>
                        ${previewText ? `<div class="text-[10px] text-slate-400 dark:text-slate-500 font-mono mt-0.5 truncate">${previewText}</div>` : ''}
                    </div>
                </div>
            `;
            
            currentTurnDiv.appendChild(div);
            return div; 
        }

        function updateActionStatus(actionEl, success, result) {
            if (!actionEl) return;
            const badge = actionEl.querySelector('.status-badge');
            
            if (success) {
                badge.innerHTML = `<svg class="w-3.5 h-3.5 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" /></svg>`;
            } else {
                badge.innerHTML = `<svg class="w-3.5 h-3.5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" /></svg>`;
            }

            // Display a distinct result area if it's not a system/preview JSON
            if (result && !result.trim().startsWith('{')) {
                const resultBlock = document.createElement('div');
                resultBlock.className = 'mt-2.5 pt-2 border-t border-slate-50 dark:border-slate-800';
                resultBlock.innerHTML = `
                    <div class="text-[10px] text-slate-500 dark:text-slate-400 font-mono leading-relaxed bg-slate-50 dark:bg-black/30 p-2.5 rounded border-l-2 border-slate-200 dark:border-slate-700">
                        ${result.substring(0, 200).replace(/\n/g, '<br>')}
                        ${result.length > 200 ? '...' : ''}
                    </div>
                `;
                actionEl.appendChild(resultBlock);
            }
        }

        let lastActionEl = null;

        async function handleEvent(event) {
            // -- Terminal Log (Keep these for the "Terminal" tab debug view) --
            switch(event.type) {
                case 'system': await appendLog(event.message, 'dim'); break;
                case 'status': await appendLog(event.message, 'system'); break;
                case 'code': 
                    await appendLog('Generated Python Code:', 'system');
                    const codeBlock = document.createElement('div');
                    codeBlock.className = 'ml-12 my-2 p-4 bg-slate-900 border border-slate-800 rounded-lg text-xs font-mono text-blue-200 whitespace-pre overflow-x-auto shadow-inner custom-scroll';
                    codeBlock.innerHTML = `<code class="language-python">${event.content}</code>`;
                    logsContainer.appendChild(codeBlock);
                    terminalOutput.scrollTo({ top: terminalOutput.scrollHeight, behavior: 'smooth' });
                    break;
                case 'output':
                    await appendLog('Execution Result:', 'success');
                    const outBlock = document.createElement('div');
                    outBlock.className = 'ml-12 my-2 p-4 bg-black/80 border-l-2 border-green-500/50 rounded-r-lg text-xs font-mono text-green-300 whitespace-pre overflow-x-auto';
                    outBlock.textContent = event.content;
                    logsContainer.appendChild(outBlock);
                    terminalOutput.scrollTo({ top: terminalOutput.scrollHeight, behavior: 'smooth' });
                    break;
                case 'answer':
                    await appendLog('Agent Answer:', 'success');
                    const answerBlock = document.createElement('div');
                    answerBlock.className = 'ml-12 my-2 p-5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-sans text-slate-800 dark:text-slate-200 whitespace-pre-wrap shadow-sm';
                    answerBlock.textContent = event.content;
                    logsContainer.appendChild(answerBlock);
                    terminalOutput.scrollTo({ top: terminalOutput.scrollHeight, behavior: 'smooth' });

                    // Add Answer to Workflow
                    if (currentTurnDiv) {
                        const div = document.createElement('div');
                        div.className = 'mt-3 p-3 bg-emerald-50 dark:bg-emerald-900/10 border border-emerald-100 dark:border-emerald-800/50 rounded-lg text-xs text-slate-600 dark:text-slate-300 leading-relaxed';
                        div.innerHTML = `<div class="flex items-center gap-2 mb-1 text-emerald-600 dark:text-emerald-400 font-bold uppercase tracking-tighter">
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                            Task Completed
                        </div>${event.content.substring(0, 200)}${event.content.length > 200 ? '...' : ''}`;
                        currentTurnDiv.appendChild(div);
                        workflowContainer.scrollTo({ top: workflowContainer.scrollHeight, behavior: 'smooth' });
                        document.querySelectorAll('.turn-card').forEach(card => card.classList.remove('animate-pulse-border'));
                    }
                    break;
                case 'error': await appendLog(event.message, 'error'); break;
            }

            // -- Workflow Visualization --
            
            // Ensure Workflow Container is visible if we start running
            if (previewPlaceholder && !previewPlaceholder.classList.contains('hidden')) {
                 previewPlaceholder.classList.add('hidden');
                 workflowContainer.classList.remove('hidden');
            }

            // Parse Turns
            if (event.type === 'status') {
                const turnMatch = event.message.match(/Thinking \(Turn (\d+)\)/);
                if (turnMatch) {
                    const turnIndex = turnMatch[1];
                    currentTurnDiv = getOrCreateTurnDiv(turnIndex);
                }
                
                if (event.message.startsWith('Calling tool:')) {
                    const toolName = event.message.split(':')[1].trim();
                    lastActionEl = appendAction(toolName, {});
                }
            }
            
            // IGNORE THOUGHTS IN VISUALIZER
            // if (event.type === 'thought') {
            //    appendThought(event.content);
            // }

            if (event.type === 'output') {
                 if (lastActionEl) {
                    updateActionStatus(lastActionEl, true, event.content);
                    lastActionEl = null;
                 }
                 
                 // Check for preview data in output
                 try {
                    const trimmed = event.content.trim();
                    if (trimmed.startsWith('{') && trimmed.endsWith('}')) {
                        const data = JSON.parse(trimmed);
                        if (data.type === 'file_preview' || data.type === 'preview') {
                            await handleEvent({
                                type: 'preview',
                                path: data.path,
                                mime: data.mime,
                                content: data.content
                            });
                        }
                    }
                 } catch(e) {}
            }
            
            if (event.type === 'error') {
                 if (lastActionEl) {
                    updateActionStatus(lastActionEl, false, event.message);
                    lastActionEl = null;
                 }
            }

            if (event.type === 'preview' || event.type === 'file_preview') {
                 // Add a Preview Card to the workflow
                 if (currentTurnDiv) {
                    const div = document.createElement('div');
                    div.className = 'mt-4 rounded-lg overflow-hidden border border-slate-200 dark:border-slate-700 bg-white dark:bg-black shadow-lg animate-in zoom-in-95 duration-500';
                    
                    div.innerHTML = `
                        <div class="px-3 py-1.5 bg-slate-50 dark:bg-slate-900 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center text-[10px] text-slate-400 font-mono">
                            <span>${event.path || 'Artifact'}</span>
                        </div>
                        <div class="relative h-[400px] iframe-container"></div>
                    `;
                    
                    const iframe = document.createElement('iframe');
                    iframe.className = 'w-full h-full border-none bg-white';
                    
                    if (event.mime === 'url') {
                        iframe.src = event.content;
                    } else if (event.mime === 'text/html') {
                        iframe.srcdoc = event.content;
                    } else if (event.mime && event.mime.startsWith('image/')) {
                         iframe.srcdoc = `
                            <body style="margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#f8fafc;">
                                <img src="data:${event.mime};base64,${event.content}" style="max-width:90%;max-height:90%;box-shadow:0 4px 6px -1px rgba(0, 0, 0, 0.1);border-radius:8px;">
                            </body>`;
                    } else {
                        iframe.srcdoc = `<pre style="padding:20px;white-space:pre-wrap;font-family:monospace;color:#333;font-size:12px;">${event.content}</pre>`;
                    }

                    div.querySelector('.iframe-container').appendChild(iframe);
                    currentTurnDiv.appendChild(div);
                    workflowContainer.scrollTo({ top: workflowContainer.scrollHeight, behavior: 'smooth' });
                    
                    // Also switch to preview tab automatically
                    switchTab('preview');
                 }
            }
        }

        runBtn.addEventListener('click', async () => {
            const task = taskInput.value.trim();
            if (!task) {
                taskInput.focus();
                taskInput.classList.add('ring-2', 'ring-red-500/50');
                setTimeout(() => taskInput.classList.remove('ring-2', 'ring-red-500/50'), 500);
                return;
            }

            // Disable UI
            runBtn.disabled = true;
            const originalBtnContent = runBtn.innerHTML;
            runBtn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Processing...
            `;

            logsContainer.innerHTML = ''; 
            workflowContainer.innerHTML = '';
            currentTurnDiv = null;
            lastActionEl = null;
            
            // Show Workflow container, hide placeholder
            previewPlaceholder.classList.add('hidden');
            workflowContainer.classList.remove('hidden');

            switchTab('preview'); 
            
            try {
                const response = await fetch('/api/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        task: task,
                        files: uploadedFiles 
                    })
                });

                // Reset Files after submit
                uploadedFiles = [];
                fileChips.innerHTML = '';

                if (!response.ok) {
                    throw new Error(`Server returned ${response.status}: ${response.statusText}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); 

                    for (const line of lines) {
                        if (!line.trim()) continue;
                        try {
                            const event = JSON.parse(line);
                            await handleEvent(event);
                        } catch (e) {
                            console.error("JSON Parse error:", line, e);
                        }
                    }
                }
                
            } catch (e) {
                console.error("Execution error:", e);
                await appendLog(`Critical Failure: ${e.message}`, 'error');
                if(lastActionEl) updateActionStatus(lastActionEl, false, e.message);
            } finally {
                runBtn.disabled = false;
                runBtn.innerHTML = originalBtnContent;
                // Remove animation from the last active card
                if (currentTurnDiv) {
                    const activeCard = currentTurnDiv.closest('.turn-card');
                    if (activeCard) activeCard.classList.remove('animate-pulse-border');
                }
            }
        });
    </script>
</body>
</html>
