<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manus Desktop Sandbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 h-screen overflow-hidden flex flex-col">

    <!-- Header -->
    <header class="h-14 bg-slate-900 border-b border-slate-800 flex items-center px-4 justify-between shrink-0">
        <div class="flex items-center gap-2">
            <div class="w-6 h-6 rounded bg-blue-600 flex items-center justify-center text-white text-xs font-bold">M</div>
            <h1 class="font-bold text-sm tracking-wide">Desktop Sandbox Verification</h1>
        </div>
        <a href="/" class="text-xs text-slate-400 hover:text-white transition">Back to Agent</a>
    </header>

    <!-- Main -->
    <div class="flex-1 flex overflow-hidden">
        <!-- Stream View -->
        <div class="flex-1 bg-black relative flex items-center justify-center overflow-hidden group">
            <iframe id="streamFrame" class="w-full h-full border-none hidden"></iframe>
            
            <div id="placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-white gap-4 bg-slate-950 z-10">
                <div class="text-slate-500 text-sm mb-2">Initialize the desktop environment to start streaming</div>
                <button id="startBtn" onclick="startDesktop()" class="px-6 py-2.5 bg-blue-600 text-white font-medium text-sm rounded-lg hover:bg-blue-500 transition shadow-lg shadow-blue-900/20 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    Start Desktop Sandbox
                </button>
                <div id="loader" class="hidden flex flex-col items-center gap-2">
                    <svg class="animate-spin h-6 w-6 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span class="text-xs text-slate-500">Starting container...</span>
                </div>
            </div>

            <!-- Overlay for click tracking (when active) -->
            <div id="clickOverlay" class="absolute inset-0 z-20 hidden cursor-crosshair" onclick="handleMapClick(event)"></div>
        </div>
        
        <!-- Controls -->
        <div class="w-80 bg-slate-900 border-l border-slate-800 p-5 overflow-y-auto flex flex-col gap-6 shrink-0">
           
           <!-- Status -->
           <div class="p-3 rounded-lg bg-slate-800/50 border border-slate-700/50">
               <div class="flex justify-between items-center mb-1">
                   <span class="text-xs font-bold text-slate-400">STATUS</span>
                   <span id="statusIndicator" class="text-[10px] px-1.5 py-0.5 rounded-full bg-slate-700 text-slate-300">Offline</span>
               </div>
               <div class="text-[10px] text-slate-500 font-mono break-all" id="streamUrlDisplay">No active stream</div>
           </div>

           <!-- Mouse -->
           <div class="space-y-3">
               <div class="flex justify-between items-center">
                   <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Mouse Control</h3>
                   <label class="flex items-center gap-2 text-[10px] text-slate-400 cursor-pointer">
                       <input type="checkbox" id="trackClick" class="rounded bg-slate-800 border-slate-700 text-blue-600 focus:ring-0">
                       Tap to Click
                   </label>
               </div>
               
               <div class="grid grid-cols-2 gap-2">
                   <div class="relative">
                       <span class="absolute left-2 top-2 text-xs text-slate-500">X</span>
                       <input id="mouseX" type="number" value="500" class="w-full bg-slate-800 border border-slate-700 rounded p-2 pl-6 text-white text-xs font-mono focus:border-blue-500 focus:outline-none">
                   </div>
                   <div class="relative">
                       <span class="absolute left-2 top-2 text-xs text-slate-500">Y</span>
                       <input id="mouseY" type="number" value="400" class="w-full bg-slate-800 border border-slate-700 rounded p-2 pl-6 text-white text-xs font-mono focus:border-blue-500 focus:outline-none">
                   </div>
               </div>
               <div class="grid grid-cols-3 gap-2">
                   <button onclick="doClick()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white text-xs py-2 rounded transition">L-Click</button>
                   <button onclick="doDoubleClick()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white text-xs py-2 rounded transition">Dbl-Click</button>
                   <button onclick="doRightClick()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white text-xs py-2 rounded transition">R-Click</button>
               </div>
               <div class="flex gap-2 items-center">
                    <button onclick="doScroll(-100)" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white text-xs py-1.5 rounded transition">Scroll Up</button>
                    <button onclick="doScroll(100)" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white text-xs py-1.5 rounded transition">Scroll Down</button>
               </div>
           </div>

           <!-- Keyboard -->
           <div class="space-y-3 pt-4 border-t border-slate-800">
               <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Keyboard</h3>
               <textarea id="typeText" rows="2" placeholder="Type text here..." class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white text-xs font-mono focus:border-blue-500 focus:outline-none resize-none"></textarea>
               <button onclick="doType()" class="w-full bg-blue-600/20 hover:bg-blue-600/30 border border-blue-600/50 text-blue-400 text-xs py-2 rounded transition font-medium">Type Text</button>
               
               <div class="grid grid-cols-4 gap-2 mt-2">
                   <button onclick="doPress('Enter')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white text-[10px] py-2 rounded transition">Enter</button>
                   <button onclick="doPress('Space')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white text-[10px] py-2 rounded transition">Space</button>
                   <button onclick="doPress('Backspace')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white text-[10px] py-2 rounded transition">Bksp</button>
                   <button onclick="doPress('Tab')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white text-[10px] py-2 rounded transition">Tab</button>
               </div>
           </div>

           <!-- App -->
           <div class="space-y-3 pt-4 border-t border-slate-800">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Launch App</h3>
                <div class="flex gap-2">
                    <input id="appName" type="text" placeholder="e.g. google-chrome" value="google-chrome" class="flex-1 bg-slate-800 border border-slate-700 rounded p-2 text-white text-xs focus:border-blue-500 focus:outline-none">
                    <button onclick="doOpen()" class="bg-slate-700 hover:bg-slate-600 text-white px-3 rounded text-xs transition">Go</button>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button onclick="quickLaunch('google-chrome')" class="text-[10px] bg-slate-800 px-2 py-1 rounded border border-slate-700 hover:border-blue-500 transition">Chrome</button>
                    <button onclick="quickLaunch('firefox')" class="text-[10px] bg-slate-800 px-2 py-1 rounded border border-slate-700 hover:border-blue-500 transition">Firefox</button>
                    <button onclick="quickLaunch('gnome-terminal')" class="text-[10px] bg-slate-800 px-2 py-1 rounded border border-slate-700 hover:border-blue-500 transition">Terminal</button>
                </div>
           </div>
           
           <!-- Screenshot -->
           <div class="space-y-3 pt-4 border-t border-slate-800">
               <button onclick="takeScreenshot()" class="w-full bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-600/50 text-emerald-400 text-xs py-2 rounded transition font-medium flex items-center justify-center gap-2">
                   <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                   Capture Screenshot
               </button>
               <div id="screenshotContainer" class="hidden rounded-lg overflow-hidden border border-slate-700 relative group/shot">
                   <img id="screenshotImg" class="w-full bg-slate-800">
                   <a id="screenshotLink" href="#" download="screenshot.png" class="absolute inset-0 bg-black/50 flex items-center justify-center opacity-0 group-hover/shot:opacity-100 transition text-white text-xs font-bold">Download</a>
               </div>
           </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/desktop';
        let isStarted = false;

        async function startDesktop() {
            const btn = document.getElementById('startBtn');
            const loader = document.getElementById('loader');
            const placeholder = document.getElementById('placeholder');
            
            btn.classList.add('hidden');
            loader.classList.remove('hidden');

            try {
                const res = await fetch(`${API_BASE}/start`, { method: 'POST' });
                const data = await res.json();
                
                if (data.status === 'started') {
                    setupStream(data.stream_url);
                } else {
                    alert('Error: ' + JSON.stringify(data));
                    btn.classList.remove('hidden');
                    loader.classList.add('hidden');
                }
            } catch (e) {
                alert('Connection Error: ' + e);
                btn.classList.remove('hidden');
                loader.classList.add('hidden');
            }
        }

        function setupStream(url) {
            isStarted = true;
            const iframe = document.getElementById('streamFrame');
            const placeholder = document.getElementById('placeholder');
            const statusIndicator = document.getElementById('statusIndicator');
            const streamUrlDisplay = document.getElementById('streamUrlDisplay');
            const clickOverlay = document.getElementById('clickOverlay');
            const trackClick = document.getElementById('trackClick');

            iframe.src = url;
            iframe.classList.remove('hidden');
            placeholder.classList.add('hidden');
            
            statusIndicator.textContent = 'Active';
            statusIndicator.className = 'text-[10px] px-1.5 py-0.5 rounded-full bg-green-500/20 text-green-400 border border-green-500/50';
            streamUrlDisplay.textContent = url;

            // Toggle overlay based on checkbox
            trackClick.addEventListener('change', (e) => {
                 if(e.target.checked) {
                     clickOverlay.classList.remove('hidden');
                 } else {
                     clickOverlay.classList.add('hidden');
                 }
            });
        }

        async function doClick() {
            const x = parseInt(document.getElementById('mouseX').value);
            const y = parseInt(document.getElementById('mouseY').value);
            await fetch(`${API_BASE}/click`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ x, y })
            });
        }
        
        async function doDoubleClick() {
            const x = parseInt(document.getElementById('mouseX').value);
            const y = parseInt(document.getElementById('mouseY').value);
            await fetch(`${API_BASE}/double_click`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ x, y })
            });
        }
        
        async function doRightClick() {
            const x = parseInt(document.getElementById('mouseX').value);
            const y = parseInt(document.getElementById('mouseY').value);
            await fetch(`${API_BASE}/right_click`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ x, y })
            });
        }
        
        async function doScroll(amount) {
            await fetch(`${API_BASE}/scroll`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ amount })
            });
        }

        async function doType() {
            const text = document.getElementById('typeText').value;
            await fetch(`${API_BASE}/type`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ text })
            });
            document.getElementById('typeText').value = '';
        }

        async function doPress(key) {
            await fetch(`${API_BASE}/press`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ key })
            });
        }

        async function quickLaunch(app) {
            document.getElementById('appName').value = app;
            doOpen();
        }

        async function doOpen() {
            const appName = document.getElementById('appName').value;
            await fetch(`${API_BASE}/open`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ app_name: appName })
            });
        }

        async function takeScreenshot() {
            try {
                const res = await fetch(`${API_BASE}/screenshot`, { method: 'POST' });
                const data = await res.json();
                if (data.screenshot) {
                    const img = document.getElementById('screenshotImg');
                    const container = document.getElementById('screenshotContainer');
                    const link = document.getElementById('screenshotLink');
                    
                    img.src = `data:image/png;base64,${data.screenshot}`;
                    link.href = img.src;
                    container.classList.remove('hidden');
                }
            } catch (e) {
                console.error(e);
            }
        }

        // Overlay Map Logic
        function handleMapClick(e) {
            const rect = e.target.getBoundingClientRect();
            // This is a rough estimation because iframe might scale.
            // But usually noVNC fits the window. 
            // If strict pixel mapping is needed, we need to know remote screen resolution vs iframe size.
            // For now, let's assume 1:1 or use relative percentage if we knew screen size.
            // Since we don't know remote screen size easily without an API call, we just use offset.
            // BUT, usually people set remote screen to fixed like 1024x768.
            // Let's just update the Inputs so user can fine tune.
            
            // To make this useful, we might just guess or assume a standard resolution like 1280x800 or 1024x768
            // Let's just put the client coordinates relative to the iframe.
            
            const x = Math.floor(e.clientX - rect.left);
            const y = Math.floor(e.clientY - rect.top);
            
            document.getElementById('mouseX').value = x;
            document.getElementById('mouseY').value = y;
            
            // Optional: Auto click?
            doClick();
        }
    </script>
</body>
</html>
